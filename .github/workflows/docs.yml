name: Docs
on: 
  push:
    branches: [main, merge/docs-gh-pages]
permissions: 
  contents: read
  pages: write
  id-token: write
jobs: 
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: clean docs folder
        run: cargo clean --doc
      - name: build docs
        run: cargo doc --no-deps
      - name: add redirect
        run: echo '<meta http-equiv="refresh" content="0;url=debruijn/index.html">' > target/doc/index.html
      - name: remove lock file
        run: rm target/doc/.lock
      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with: 
          path: target/doc
  deploy: 
    name: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps: 
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4